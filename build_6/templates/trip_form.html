{% extends "base.html" %}

{% block content %}
<h2>{% if trip %}Редактировать{% else %}Добавить{% endif %} поездку</h2>

<form method="POST" class="add-form">
    <input type="text" name="title" placeholder="Название поездки" value="{{ trip.title if trip else '' }}" required>
    <input type="text" name="destination" placeholder="Пункт назначения" value="{{ trip.destination if trip else '' }}" required>
    <input type="text" name="start_date" placeholder="Дата начала (ГГГГ-ММ-ДД)" value="{{ trip.start_date if trip else '' }}" required>
    <input type="text" name="end_date" placeholder="Дата конца (ГГГГ-ММ-ДД)" value="{{ trip.end_date if trip else '' }}" required>
    <input type="text" name="description" placeholder="Описание" value="{{ trip.description if trip else '' }}">
    <button type="submit" class="btn">Сохранить</button>
    <a href="{{ url_for('index') }}" class="btn btn-sm">Отмена</a>
</form>
{% endblock %}
