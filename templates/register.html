{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Регистрация</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
    <input type="text" name="username" placeholder="Логин (мин. 3 символа)" required>
    <input type="password" name="password" placeholder="Пароль (мин. 3 символа)" required>
    <button type="submit">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="/login">Войти</a></p>
{% endblock %}
