{% extends "base.html" %}

{% block title %}{% if trip %}Редактировать{% else %}Новая поездка{% endblock %}{% endblock %}

{% block content %}
<h2>{% if trip %}Редактировать поездку{% else %}Добавить поездку{% endblock %}</h2>
<form method="POST">
    <input type="text" name="title" placeholder="Название поездки" value="{{ trip.title if trip else '' }}" required>
    <input type="text" name="destination" placeholder="Пункт назначения" value="{{ trip.destination if trip else '' }}" required>
    <input type="date" name="start_date" value="{{ trip.start_date if trip else '' }}" required>
    <input type="date" name="end_date" value="{{ trip.end_date if trip else '' }}" required>
    <input type="number" name="budget" placeholder="Бюджет" value="{{ trip.budget if trip else '' }}" step="0.01">
    <input type="text" name="description" placeholder="Описание" value="{{ trip.description if trip else '' }}">
    <button type="submit" class="btn">Сохранить</button>
    <a href="/" class="btn btn-sm">Отмена</a>
</form>
{% endblock %}
