<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Планировщик поездок{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🗺️ Планировщик поездок</h1>
            <nav>
                {% if user %}
                    <a href="/">Мои поездки</a>
                    <a href="/stats">Статистика</a>
                    <span class="user">Вход как: {{ user.username }}</span>
                    <a href="/logout">Выйти</a>
                {% else %}
                    <a href="/login">Войти</a>
                    <a href="/register">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <div class="container">
            <small>TripPlanner — учебный проект (тема 9: Планировщик поездок)</small>
        </div>
    </footer>
</body>
</html>
